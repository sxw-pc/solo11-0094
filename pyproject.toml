[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tzgate"
version = "0.1.0"
description = "Offline timezone semantics and partition-day verifier"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
tzgate = "tzgate.cli:main"

[tool.setuptools.packages.find]
include = ["tzgate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
